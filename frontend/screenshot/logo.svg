<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="WorkMonitor logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App icon base -->
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect width="256" height="128" rx="60" fill="url(#shine)"/>

  <!-- Kanban lanes -->
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="44" y="56" width="52" height="144" rx="12"/>
    <rect x="102" y="56" width="52" height="144" rx="12"/>
    <rect x="160" y="56" width="52" height="144" rx="12"/>
  </g>

  <!-- Task cards -->
  <g fill="#ffffff">
    <rect x="50" y="68" width="40" height="22" rx="6"/>
    <rect x="50" y="96" width="40" height="22" rx="6"/>
    <rect x="50" y="124" width="40" height="22" rx="6" fill-opacity="0.7"/>
    <rect x="108" y="68" width="40" height="22" rx="6"/>
    <rect x="108" y="96" width="40" height="22" rx="6" fill-opacity="0.7"/>
    <rect x="166" y="68" width="40" height="22" rx="6" fill-opacity="0.7"/>
  </g>

  <!-- Done / monitor badge -->
  <circle cx="188" cy="178" r="32" fill="#0F766E"/>
  <circle cx="188" cy="178" r="26" fill="#ffffff"/>
  <path d="M175 178 l9 9 l19 -21" fill="none" stroke="#0D9488" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
