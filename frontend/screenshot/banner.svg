<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="WorkMonitor Enterprise - Task management for modern teams" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042F2E"/>
      <stop offset="0.55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="url(#bannerBg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <circle cx="1180" cy="-20" r="220" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="640" cy="360" r="200" fill="#ffffff" fill-opacity="0.04"/>
  </g>

  <!-- Logo icon -->
  <g transform="translate(72 78) scale(0.62)">
    <rect width="256" height="256" rx="60" fill="url(#iconBg)"/>
    <g fill="#ffffff" fill-opacity="0.18">
      <rect x="44" y="56" width="52" height="144" rx="12"/>
      <rect x="102" y="56" width="52" height="144" rx="12"/>
      <rect x="160" y="56" width="52" height="144" rx="12"/>
    </g>
    <g fill="#ffffff">
      <rect x="50" y="68" width="40" height="22" rx="6"/>
      <rect x="50" y="96" width="40" height="22" rx="6"/>
      <rect x="50" y="124" width="40" height="22" rx="6" fill-opacity="0.7"/>
      <rect x="108" y="68" width="40" height="22" rx="6"/>
      <rect x="108" y="96" width="40" height="22" rx="6" fill-opacity="0.7"/>
      <rect x="166" y="68" width="40" height="22" rx="6" fill-opacity="0.7"/>
    </g>
    <circle cx="188" cy="178" r="32" fill="#0F766E"/>
    <circle cx="188" cy="178" r="26" fill="#ffffff"/>
    <path d="M175 178 l9 9 l19 -21" fill="none" stroke="#0D9488" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="270" y="140" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-1">WorkMonitor</text>
    <text x="274" y="186" font-size="24" font-weight="600" fill="#5EEAD4" letter-spacing="10">ENTERPRISE</text>
    <text x="274" y="238" font-size="24" fill="#CCFBF1">Task management for modern teams</text>
    <text x="274" y="272" font-size="16" fill="#99F6E4" fill-opacity="0.85" letter-spacing="1">Kanban  ·  Sprints  ·  Backlog  ·  Analytics  ·  Audit Trail  ·  RBAC</text>
  </g>

  <!-- Mini Kanban illustration -->
  <g transform="translate(880 64)">
    <g fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22">
      <rect x="0" y="0" width="96" height="192" rx="14"/>
      <rect x="110" y="0" width="96" height="192" rx="14"/>
      <rect x="220" y="0" width="96" height="192" rx="14"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.9">
      <rect x="10" y="38" width="76" height="34" rx="8"/>
      <rect x="10" y="82" width="76" height="34" rx="8" fill-opacity="0.6"/>
      <rect x="10" y="126" width="76" height="34" rx="8" fill-opacity="0.35"/>
      <rect x="120" y="38" width="76" height="34" rx="8"/>
      <rect x="120" y="82" width="76" height="34" rx="8" fill-opacity="0.6"/>
      <rect x="230" y="38" width="76" height="34" rx="8" fill="#5EEAD4"/>
    </g>
    <g fill="#0F766E" fill-opacity="0.55">
      <rect x="18" y="49" width="40" height="5" rx="2.5"/>
      <rect x="18" y="59" width="26" height="4" rx="2"/>
      <rect x="128" y="49" width="44" height="5" rx="2.5"/>
      <rect x="128" y="59" width="28" height="4" rx="2"/>
      <rect x="238" y="49" width="38" height="5" rx="2.5"/>
      <rect x="238" y="59" width="24" height="4" rx="2"/>
    </g>
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.85" letter-spacing="1.5">
      <text x="10" y="22">TO DO</text>
      <text x="120" y="22">REVIEW</text>
      <text x="230" y="22">DONE</text>
    </g>
  </g>
</svg>
